<!doctype html>
<meta charset="utf-8">
<pre id="resultado">NAO EXECUTADO</pre>
<script src="../src/core.js"></script>
<script>
  const C = RevisorCore;
  const casos = [];
  const caso = (nome, fn) => casos.push([nome, fn]);
  const igual = (a, b) => {
    if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)}`);
  };
  const s = (tipo, original, substituicao) => ({ tipo, original, substituicao, motivo: 'm' });
  const filtra = (texto, brutas, op) => C.filtrarSugestoes(texto, brutas, op).map((x) => [x.tipo, x.original, x.substituicao, x.inicio]);

  const sug = (original, substituicao, inicio) => ({ tipo: 'gramatica', original, substituicao, inicio, fim: inicio + original.length });

  caso('parágrafo curto vira um trecho só com todas as correções', () => {
    const t = 'eu vou mercado e açim.';
    const trechos = C.trechosDoParagrafo(t, [sug('açim', 'assim', 17), sug('vou mercado', 'vou ao mercado', 3)]);
    igual(trechos.map((x) => [x.inicio, x.fim, x.sugestoes.map((s) => s.original)]), [[0, 22, ['vou mercado', 'açim']]]);
    igual(C.aplicarTrecho(t, trechos[0].sugestoes, trechos[0]).texto, 'eu vou ao mercado e assim.');
  });

  caso('parágrafo longo vira um trecho por frase com correção, sem o espaço final', () => {
    const t = `Uma açim. ${'Frase limpa sem nada. '.repeat(14)}Outra nóis!`;
    const fim = t.length;
    const trechos = C.trechosDoParagrafo(t, [sug('açim', 'assim', 4), sug('nóis', 'nós', fim - 5)]);
    igual(trechos.map((x) => t.slice(x.inicio, x.fim)), ['Uma açim.', 'Outra nóis!']);
  });

  caso('correção que cruza o fim da frase junta as frases no mesmo trecho', () => {
    const t = `${'Frase limpa sem nada. '.repeat(13)}Fim. Começo errado aqui.`;
    const inicio = t.indexOf('Fim. Começo');
    const trechos = C.trechosDoParagrafo(t, [sug('Fim. Começo', 'Fim, começo', inicio)]);
    igual(trechos.map((x) => t.slice(x.inicio, x.fim)), ['Fim. Começo errado aqui.']);
  });

  caso('a prévia do trecho alterna texto igual e troca', () => {
    const t = 'eu vou mercado hoje';
    const [trecho] = C.trechosDoParagrafo(t, [sug('vou mercado', 'vou ao mercado', 3)]);
    igual(C.partesDoTrecho(t, trecho), [{ igual: 'eu ' }, { de: 'vou mercado', para: 'vou ao mercado', tipo: 'gramatica', regra: { nome: '', explicacao: '' } }, { igual: ' hoje' }]);
  });

  caso('divide em parágrafos com o deslocamento de cada um', () => {
    igual(C.dividirParagrafos('ab\n\ncd'), [{ texto: 'ab', inicio: 0 }, { texto: '', inicio: 3 }, { texto: 'cd', inicio: 4 }]);
  });

  caso('parágrafo sem letras ou curto não é revisado', () => {
    igual([C.revisavel('ok'), C.revisavel('123 456'), C.revisavel('tudo certo')], [false, false, true]);
  });

  const longa = (n) => Array.from({ length: n }, (_, i) => `p${i}`).join(' ');

  caso('qualquer tipo pode acrescentar até 10 palavras', () => {
    igual(filtra('o texto ruim', [s('palavra', 'ruim', `ruim ${longa(10)}`)]).length, 1);
    igual(filtra('eu vou mercado', [s('gramatica', 'vou mercado', 'vou até o mercado')]), [['gramatica', 'vou mercado', 'vou até o mercado', 3]]);
  });

  caso('troca com mais de 10 palavras a mais é descartada em qualquer tipo', () => {
    igual(filtra('o texto ruim', [s('palavra', 'ruim', `ruim ${longa(11)}`), s('gramatica', 'texto', `texto ${longa(11)}`)]), []);
  });

  caso('troca do mesmo tamanho ou menor é aceita', () => {
    igual(filtra('o texto ruim', [s('palavra', 'ruim', 'mau')]), [['palavra', 'ruim', 'mau', 8]]);
  });

  caso('conta palavras com acento, hífen, apóstrofo e número', () => {
    igual([C.contarPalavras('fazê-lo à tarde'), C.contarPalavras("d'água 2026 ok"), C.contarPalavras('  ')], [3, 3, 0]);
  });

  caso('original que não existe no texto é descartado', () => {
    igual(filtra('casa amarela', [s('gramatica', 'caza', 'casa')]), []);
  });

  caso('tipo desconhecido e troca idêntica são descartados', () => {
    igual(filtra('casa amarela', [s('estilo', 'casa', 'lar'), s('palavra', 'casa', 'casa')]), []);
  });

  caso('palavra do dicionário não é marcada, mas substring dela sim', () => {
    igual(filtra('a Arrudacorsi ganhou', [s('gramatica', 'Arrudacorsi', 'Arruda')], { dicionario: ['arrudacorsi'] }), []);
    igual(filtra('o pix caiu', [s('palavra', 'pix', 'PIX')], { dicionario: ['pi'] }), [['palavra', 'pix', 'PIX', 2]]);
  });

  caso('a mesma palavra repetida marca ocorrências diferentes sem sobrepor', () => {
    igual(filtra('mas mas', [s('clareza', 'mas', ''), s('clareza', 'mas', '')]), [['clareza', 'mas', '', 0], ['clareza', 'mas', '', 4]]);
  });

  caso('posição informada pela camada vale mesmo com a palavra repetida antes', () => {
    igual(C.filtrarSugestoes('açim e açim', [{ ...s('gramatica', 'açim', 'assim'), inicio: 7, origem: 'offline' }]).map((x) => [x.inicio, x.origem]), [[7, 'offline']]);
  });

  caso('sem posição informada, o trecho só casa com palavra inteira', () => {
    igual(filtra('vc vai na rua, n sei', [s('tom', 'n', 'não')]), [['tom', 'n', 'não', 15]]);
    igual(filtra('vou, tipo, sair', [s('clareza', 'tipo, ', '')]), [['clareza', 'tipo, ', '', 5]]);
  });

  caso('trecho protegido não recebe marca de nenhuma camada', () => {
    igual(filtra('vc vai', [{ ...s('gramatica', 'vc', 'vs'), inicio: 0, origem: 'offline' }, s('tom', 'vai', 'irá')], { protegidos: [{ inicio: 0, fim: 2 }] }), [['tom', 'vai', 'irá', 3]]);
  });

  caso('posição informada que não bate com o texto cai na busca pelo trecho', () => {
    igual(filtra('casa açim', [{ ...s('gramatica', 'açim', 'assim'), inicio: 0 }]), [['gramatica', 'açim', 'assim', 5]]);
  });

  caso('no mesmo trecho vence o modelo, depois o LanguageTool, depois o offline; sem origem vira openrouter', () => {
    const vc = (origem, troca) => ({ ...s('gramatica', 'vc', troca), inicio: 0, origem });
    igual(C.filtrarSugestoes('vc vai', [vc('offline', 'vs'), vc('languagetool', 'VC'), { ...s('tom', 'vc', 'você'), inicio: 0 }]).map((x) => x.substituicao), ['você']);
    igual(C.filtrarSugestoes('vc vai', [vc('offline', 'vs'), vc('languagetool', 'VC')]).map((x) => x.substituicao), ['VC']);
    igual(C.filtrarSugestoes('vou açim', [s('palavra', 'açim', 'assim')]).map((x) => x.origem), ['openrouter']);
  });

  caso('aplicar desloca as sugestões seguintes e remove a aplicada', () => {
    const t = 'eu vou mercado e açim';
    const sug = C.filtrarSugestoes(t, [s('gramatica', 'vou mercado', 'vou ao mercado'), s('gramatica', 'açim', 'assim')]);
    const r = C.aplicarNoParagrafo(t, sug, sug[0]);
    igual(r.texto, 'eu vou ao mercado e açim');
    igual(r.sugestoes.map((x) => r.texto.slice(x.inicio, x.fim)), ['açim']);
  });

  const sistemaDe = (req) => req.messages.find((m) => m.role === 'system').content;

  caso('requisição leva o tom, o dicionário, o texto e o schema JSON estrito', () => {
    const req = C.montarRequisicao('oi', { tom: 'formal', dicionario: ['Jusgrok'] });
    const sistema = sistemaDe(req);
    igual([sistema.includes('formal ('), sistema.includes('Jusgrok'), req.messages[1], req.response_format.type, req.response_format.json_schema.strict,
      req.response_format.json_schema.schema.properties.sugestoes.items.properties.tipo.enum],
    [true, true, { role: 'user', content: '<texto>\noi\n</texto>' }, 'json_schema', true, ['gramatica', 'clareza', 'palavra', 'tom']]);
  });

  caso('roteia só entre modelos gratuitos e só por provedores que aceitam o schema', () => {
    const req = C.montarRequisicao('oi');
    igual([req.models.length > 1 && req.models.length <= 3, req.models.every((m) => m.endsWith(':free')), 'model' in req, req.provider.require_parameters], [true, true, false, true]);
  });

  caso('pede a resposta sem raciocínio, que levava o modelo de 1 s para 7 a 13 s', () => {
    igual(C.montarRequisicao('oi').reasoning, { enabled: false });
  });

  caso('gíria e abreviação são marcadas em formal e neutro e deixadas em paz no casual', () => {
    const marca = (tom) => sistemaDe(C.montarRequisicao('vc vai?', { tom })).includes('marque como "tom" e troque pela forma por extenso');
    igual([marca('formal'), marca('neutro'), marca('casual'), marca(undefined)], [true, true, false, true]);
  });

  caso('modelo revisa no idioma detectado, aponta pontuação e deixa ortografia para as outras camadas', () => {
    const en = sistemaDe(C.montarRequisicao('hi', { idioma: 'en-US' }));
    const pt = sistemaDe(C.montarRequisicao('oi'));
    igual([en.includes('textos em inglês'), pt.includes('textos em português do Brasil'), pt.includes('tipo "gramatica": só pontuação'), pt.includes('regência nem crase:'), pt.includes('crase nem pontuação')], [true, true, true, true, false]);
  });

  caso('reescrita leva o tom pedido, o idioma e um schema só com o texto', () => {
    const req = C.montarReescrita('vc vem?', { tom: 'empatico', idioma: 'en-US' });
    const sistema = sistemaDe(req);
    igual([sistema.includes('em inglês, no tom empático ('), req.messages[1].content, req.response_format.json_schema.schema.required, req.models.every((m) => m.endsWith(':free'))],
      [true, '<texto>\nvc vem?\n</texto>', ['texto', 'segundosPoupados'], true]);
  });

  caso('tom LinkedIn pede verbos de ação e tom Advogado pede escrita defensiva', () => {
    const linkedin = sistemaDe(C.montarReescrita('fiz o projeto', { tom: 'linkedin', idioma: 'pt-BR' }));
    const advogado = sistemaDe(C.montarReescrita('a culpa foi nossa', { tom: 'advogado', idioma: 'pt-BR' }));
    igual([linkedin.includes('verbos de ação e de resultado'), advogado.includes('escrita defensiva'), advogado.includes('não admite culpa')], [true, true, true]);
  });

  caso('todo tom do seletor tem descrição para o modelo', () => {
    igual(Object.keys(C.ROTULOS_DE_TOM), Object.keys(C.TONS));
  });

  caso('verificação sem tom pede ortografia, pontuação, maiúsculas e escrita melhor, mantendo o tom', () => {
    const sistema = sistemaDe(C.montarReescrita('oi', { tom: '', idioma: 'pt-BR' }));
    igual(['mantendo o tom do original', 'pontuação', 'maiúsculas e minúsculas', 'Melhore a escrita'].map((t) => sistema.includes(t)), [true, true, true, true]);
  });

  caso('diferença por palavra marca só o que muda e reconstrói os dois textos', () => {
    const partes = C.diferencaDePalavras('eu vou mercado amanha', 'Eu vou ao mercado amanhã.');
    igual(partes, [{ de: 'eu', para: 'Eu' }, { igual: ' vou ' }, { de: '', para: 'ao ' }, { igual: 'mercado ' }, { de: 'amanha', para: 'amanhã.' }]);
    const junta = (campo) => partes.map((p) => ('igual' in p ? p.igual : p[campo])).join('');
    igual([junta('de'), junta('para')], ['eu vou mercado amanha', 'Eu vou ao mercado amanhã.']);
    igual(C.diferencaDePalavras('igual', 'igual'), [{ igual: 'igual' }]);
  });

  caso('reescrita mantém as quebras de linha que o usuário escreveu', () => {
    igual(C.manterQuebrasDeLinha('oi tudo bem. vamos', 'Oi, tudo bem.\nVamos'), 'Oi, tudo bem. Vamos');
    igual(C.manterQuebrasDeLinha('linha um\nlinha dois', 'Linha um. Linha dois.'), 'Linha um.\nLinha dois.');
    igual(C.manterQuebrasDeLinha('linha um\nlinha dois', 'Linha um.\nLinha dois.'), 'Linha um.\nLinha dois.');
    igual(C.manterQuebrasDeLinha('a b\n\nc d', 'A b. C d.'), 'A b.\n\nC d.');
  });

  caso('reescrita com mais de 10 palavras a mais que o original é recusada', () => {
    const original = 'vou ao mercado amanhã';
    igual([C.acrescentaDemais(original, 'Vou ao mercado amanhã cedo.'), C.acrescentaDemais(original, `${original} ${'muito texto inventado aqui '.repeat(3)}`)], [false, true]);
    igual(C.acrescentaDemais(original, `${original} um dois três quatro cinco seis sete oito nove dez`), false);
  });

  caso('lê tokens, custo e tempo poupado da resposta, com teto de uma hora', () => {
    const corpo = (segundos) => ({ model: 'm:free', usage: { prompt_tokens: 120, completion_tokens: 30, cost: 0.0004 }, choices: [{ message: { content: JSON.stringify({ texto: 'Oi.', segundosPoupados: segundos }) } }] });
    igual(C.lerReescrita(corpo(45)).uso, { entrada: 120, saida: 30, custo: 0.0004, segundos: 45 });
    igual([C.lerReescrita(corpo(99999)).uso.segundos, C.lerReescrita(corpo(-5)).uso.segundos], [3600, 0]);
  });

  caso('soma o consumo por dia e por modelo', () => {
    const uso = { entrada: 100, saida: 20, custo: 0, segundos: 30 };
    const consumo = C.somarConsumo(C.somarConsumo(C.somarConsumo({}, '2026-11-07', 'a:free', uso), '2026-11-07', 'a:free', uso), '2026-11-08', 'b:free', uso);
    igual(consumo, {
      '2026-11-07': { 'a:free': { chamadas: 2, entrada: 200, saida: 40, custo: 0, segundos: 60 } },
      '2026-11-08': { 'b:free': { chamadas: 1, entrada: 100, saida: 20, custo: 0, segundos: 30 } },
    });
  });

  caso('custo equivalente usa o preço da versão paga do modelo gratuito, quando ela existe', () => {
    const precos = C.precosPagos([
      { id: 'nvidia/nemotron-3.5-super-vl', pricing: { prompt: '0.00000015', completion: '0.0000005' } },
      { id: 'nvidia/nemotron-3.5-super-vl:free', pricing: { prompt: '0', completion: '0' } },
    ]);
    igual(Object.keys(precos), ['nvidia/nemotron-3.5-super-vl:free']);
    igual([C.custoEquivalente({ entrada: 1_000_000, saida: 1_000_000 }, precos['nvidia/nemotron-3.5-super-vl:free']).toFixed(2), C.custoEquivalente({ entrada: 1, saida: 1 }, undefined)], ['0.65', null]);
  });

  caso('lê a reescrita e rejeita resposta sem texto', () => {
    igual(C.lerReescrita({ model: 'x:free', choices: [{ message: { content: '{"texto":"Você vem?"}' } }] }), { texto: 'Você vem?', modelo: 'x:free', uso: { entrada: 0, saida: 0, custo: 0, segundos: 0 } });
    const erros = ['{"texto":"  "}', '{"outro":1}'].map((c) => { try { C.lerReescrita({ choices: [{ message: { content: c } }] }); return 'aceitou'; } catch { return 'rejeitou'; } });
    igual(erros, ['rejeitou', 'rejeitou']);
  });

  caso('lê a resposta do OpenRouter com o modelo que atendeu e rejeita formato inesperado', () => {
    igual(C.lerResposta({ model: 'google/gemma-4-31b-it:free', choices: [{ message: { content: '{"sugestoes":[{"tipo":"tom"}]}' } }] }),
      { sugestoes: [{ tipo: 'tom' }], modelo: 'google/gemma-4-31b-it:free', uso: { entrada: 0, saida: 0, custo: 0, segundos: 0 } });
    let falhas = 0;
    for (const corpo of [{ choices: [] }, { choices: [{ message: { content: 'não é json' } }] }, { choices: [{ message: { content: '{"outra":1}' } }] }]) {
      try { C.lerResposta(corpo); } catch { falhas++; }
    }
    igual(falhas, 3);
  });

  caso('modelo que atendeu acompanha a sugestão filtrada', () => {
    igual(C.filtrarSugestoes('vou açim', [{ ...s('clareza', 'açim', 'assim'), modelo: 'x/y:free' }]).map((x) => x.modelo), ['x/y:free']);
  });

  caso('sugestão v2: campos de cada origem passam, campos ausentes ganham padrão e valores fora da faixa são contidos', () => {
    const campos = (x) => [x.origem, x.categoria, x.nivel, x.confianca, x.regra.id, x.regra.explicacao];
    igual(C.filtrarSugestoes('vou açim', [{ ...s('palavra', 'açim', 'assim'), origem: 'languagetool' }]).map(campos), [['languagetool', 'fluidez', 3, 0.8, '', 'm']]);
    igual(C.filtrarSugestoes('vou açim', [{ ...s('gramatica', 'açim', 'assim'), origem: 'offline', categoria: 'ortografia', nivel: 1, regra: { id: 'ORTOGRAFIA_OFFLINE', nome: 'Ortografia', explicacao: 'grafia' } }]).map(campos), [['offline', 'ortografia', 1, 0.5, 'ORTOGRAFIA_OFFLINE', 'grafia']]);
    igual(C.filtrarSugestoes('vou açim', [{ ...s('clareza', 'açim', 'assim'), categoria: 'repeticao', confianca: 1.7, regra: { id: 'REP', nome: 'Repetição', explicacao: 'palavra repetida' } }]).map(campos), [['openrouter', 'repeticao', 3, 1, 'REP', 'palavra repetida']]);
    igual(C.filtrarSugestoes('vou açim', [{ ...s('tom', 'açim', 'assim'), categoria: 'inventada', nivel: 9, confianca: 'alta' }]).map(campos), [['openrouter', 'tom', 3, 0.6, '', 'm']]);
  });

  caso('o esquema do modelo exige categoria, confiança e regra', () => {
    const itens = C.montarRequisicao('oi', { tom: '', idioma: 'pt-BR' }).response_format.json_schema.schema.properties.sugestoes.items;
    igual([itens.required, itens.properties.categoria.enum], [['tipo', 'original', 'substituicao', 'motivo', 'categoria', 'confianca', 'regra'], C.CATEGORIAS]);
  });

  caso('troca que acrescenta link com https, www ou e-mail é descartada; link que já estava no original passa', () => {
    const troca = (substituicao, original = 'relatório') => C.filtrarSugestoes(`mande o ${original}`, [{ ...s('palavra', original, substituicao) }]).length;
    igual([troca('relatório em https://golpe.exemplo'), troca('relatório em www.golpe.exemplo'), troca('relatório para ana@golpe.exemplo'), troca('site https://x.exemplo/a', 'site https://x.exemplo'), troca('documento')], [0, 0, 0, 1, 1]);
  });

  caso('cada nível só deixa passar sugestões até ele, e o 4 aceita teto proporcional', () => {
    const brutas = [{ ...s('gramatica', 'açim', 'assim'), origem: 'offline', nivel: 1 }, s('gramatica', 'Olá João', 'Olá, João'), s('clareza', 'tudo', 'td'), { ...s('clareza', 'vamos', 'iremos'), categoria: 'estrutura' }];
    const t = 'Olá João açim tudo vamos';
    igual([1, 2, 3, 4].map((n) => C.filtrarSugestoes(t, brutas, { nivel: n }).map((x) => x.original).sort().join('|')), ['açim', 'Olá João|açim', 'Olá João|açim|tudo', 'Olá João|açim|tudo|vamos'].map((x) => x.split('|').sort().join('|')));
    const longo = 'palavra '.repeat(100);
    const grande = s('clareza', 'palavra', 'palavra ' + 'x '.repeat(15));
    igual([C.filtrarSugestoes(longo, [grande], { nivel: 4 }).length, C.filtrarSugestoes(longo, [grande], { nivel: 3 }).length, C.filtrarSugestoes('palavra curta', [grande], { nivel: 4 }).length], [1, 0, 0]);
  });

  caso('o prompt muda por nível: o 2 só pede pontuação, o 4 permite reorganizar', () => {
    const p = (nivel) => C.montarRequisicao('oi', { nivel }).messages[0].content;
    igual([p(2).includes('tipo "clareza"'), p(3).includes('tipo "clareza"'), p(3).includes('estrutura das frases'), p(4).includes('estrutura das frases'), p(4).includes('20% das palavras')], [false, true, false, true, true]);
  });

  caso('confiança: camadas que concordam sobem, que discordam descem, modelo inseguro e LanguageTool por categoria', () => {
    const v = (l) => C.filtrarSugestoes('Vou a praia açim', l).map((x) => [x.original, x.substituicao, x.confianca, x.incerta]);
    const lt = (o, n, categoria) => ({ ...s('gramatica', o, n), origem: 'languagetool', categoria });
    igual([
      v([lt('Vou a', 'Vou à', 'gramatica'), s('gramatica', 'Vou a', 'Vou à')]),
      v([lt('Vou a', 'Vou à', 'gramatica'), { ...s('gramatica', 'Vou a', 'Irei à'), confianca: 0.6 }]),
      v([{ ...s('clareza', 'açim', 'assim'), confianca: 0.3 }]),
      v([lt('açim', 'assim', 'ortografia')]),
    ], [[['Vou a', 'Vou à', 0.8, false]], [['Vou a', 'Irei à', 0.4, true]], [['açim', 'assim', 0.3, true]], [['açim', 'assim', 0.85, false]]]);
  });

  const linhas = [];
  let ok = 0;
  for (const [nome, fn] of casos) {
    try { fn(); ok++; linhas.push(`ok   ${nome}`); } catch (e) { linhas.push(`FALHA ${nome}: ${e.message}`); }
  }
  linhas.push(ok === casos.length ? `PASSED ${ok}/${casos.length}` : `FAILED ${ok}/${casos.length}`);
  document.getElementById('resultado').textContent = linhas.join('\n');
</script>

<!doctype html>
<meta charset="utf-8">
<pre id="resultado">NAO EXECUTADO</pre>
<div id="pagina"></div>
<script>
  const CHAVE = ['sk-or-v1-', 'abcd'.repeat(15), 'f9e8'].join('');
  const NOVA = ['sk-or-v1-', 'ef01'.repeat(15), '7c3a'].join('');
  globalThis.criarChrome = (armazem) => ({
    storage: {
      local: {
        get: async () => ({ ...armazem }),
        set: async (itens) => Object.assign(armazem, itens),
        remove: async () => {},
      },
      onChanged: { addListener() {} },
    },
    runtime: { sendMessage: async (msg) => (msg.tipo === 'testarChave' ? { ok: true } : {}), getURL: (p) => p },
    permissions: { request: async () => true },
  });
  const linhas = [];
  let ok = 0, total = 0;
  const confere = (nome, valor, esperado) => {
    total++;
    if (JSON.stringify(valor) === JSON.stringify(esperado)) { ok++; linhas.push(`ok   ${nome}`); }
    else linhas.push(`FALHA ${nome}: esperado ${JSON.stringify(esperado)}, veio ${JSON.stringify(valor)}`);
  };
  const espera = (ms) => new Promise((pronto) => setTimeout(pronto, ms));
  const montar = async (salvo) => {
    const armazem = { tom: 'neutro', ...salvo };
    const html = await (await fetch('../src/options.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.head.prepend(Object.assign(doc.createElement('base'), { href: new URL('../src/', location).href }));
    doc.head.prepend(Object.assign(doc.createElement('script'), { textContent: 'window.chrome = parent.criarChrome(parent.armazemAtual);' }));
    globalThis.armazemAtual = armazem;
    const quadro = document.createElement('iframe');
    quadro.style.cssText = 'width:1200px;height:900px';
    document.getElementById('pagina').replaceChildren(quadro);
    await new Promise((pronto) => { quadro.onload = pronto; quadro.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML; });
    await espera(300);
    return { doc: quadro.contentDocument, armazem };
  };
  (async () => {
    try {
      const comChave = await montar({ chaveOpenrouter: CHAVE });
      const campo = comChave.doc.getElementById('chave');
      confere('a chave salva não volta para o campo das configurações', [campo.value, comChave.doc.body.innerHTML.includes(CHAVE)], ['', false]);
      confere('o status diz que há chave e mostra só o fim dela', comChave.doc.getElementById('statusChave').textContent, 'Chave configurada, terminando em …f9e8. Cole outra para trocar.');
      campo.value = NOVA;
      comChave.doc.getElementById('salvarChave').click();
      await espera(100);
      confere('depois de salvar, a chave nova sai do campo e o status mostra só o fim dela', [comChave.armazem.chaveOpenrouter === NOVA, campo.value, comChave.doc.getElementById('statusChave').textContent], [true, '', 'Chave funcionando e salva, terminando em …7c3a. Já pode digitar em qualquer site.']);

      const semChave = await montar({});
      const radioNivel = (n) => semChave.doc.querySelector(`input[name="nivel"][value="${n}"]`);
      const marcadoAntes = radioNivel(3).checked;
      radioNivel(1).click();
      await espera(50);
      confere('sem nível salvo marca o 3, e escolher outro nível grava a escolha', [marcadoAntes, semChave.armazem.nivel], [true, 1]);
      semChave.doc.querySelector('input[name="perfil"][value="tecnico"]').click();
      await espera(50);
      confere('escolher um perfil grava o perfil, o tom e o nível dele e marca os dois seletores', [semChave.armazem.perfil, semChave.armazem.tom, semChave.armazem.nivel, semChave.doc.querySelector('input[name="tom"]:checked')?.value, semChave.doc.querySelector('input[name="nivel"]:checked')?.value], ['tecnico', 'neutro', 3, 'neutro', '3']);
      const comHistorico = await montar({ historicoDasCamadas: { languagetool: [{ ms: 40, erro: null, em: 1 }, { ms: 60, erro: 'falha', em: 2 }], openrouter: [{ ms: 900, erro: null, em: 3 }, { ms: 1000, erro: 'limite_por_minuto', em: 4 }] } });
      const linhasDoPainel = [...comHistorico.doc.querySelectorAll('#linhasDiagnostico tr')].map((tr) => [...tr.children].slice(0, 4).map((td) => td.textContent));
      confere('o diagnóstico mostra mediana, p95 e disponibilidade por camada, e avisa quando não há medição', [linhasDoPainel, comHistorico.doc.getElementById('semDiagnostico').hidden, semChave.doc.getElementById('semDiagnostico').hidden, comHistorico.doc.querySelector('#linhasDiagnostico tr:last-child td:last-child').textContent.startsWith('limite por minuto (')], [
        [['LanguageTool', '40 ms', '60 ms', '50%'], ['OpenRouter', '900 ms', '1000 ms', '50%']], true, false, true,
      ]);
      confere('sem chave salva, a página abre inteira: campo vazio, sem status, com as boas-vindas e o tom marcado', [semChave.doc.getElementById('chave').value, semChave.doc.getElementById('statusChave').textContent, semChave.doc.getElementById('boasVindas').hidden, semChave.doc.querySelector('input[name="tom"]:checked')?.value], ['', '', false, 'neutro']);
    } catch (erro) {
      total++;
      linhas.push(`FALHA exceção: ${erro.message}`);
    }
    document.getElementById('resultado').textContent = `${ok === total ? 'PASSED' : 'FAILED'} ${ok}/${total}\n${linhas.join('\n')}`;
  })();
</script>

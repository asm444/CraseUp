<!doctype html>
<meta charset="utf-8">
<style>
  textarea, [contenteditable] { display: block; width: 400px; font: 16px/1.4 sans-serif; margin: 20px; padding: 8px; border: 1px solid #999; }
</style>
<textarea id="area"></textarea>
<div id="editavel" contenteditable="true"></div>
<input id="senha" type="password">
<input id="cartao" type="text" autocomplete="cc-number">
<div id="hospedeiro"></div>
<pre id="resultado">NAO EXECUTADO</pre>
<script src="../src/core.js"></script>
<script>
  const RESPOSTAS = {
    'eu vou mercado': [
      { tipo: 'gramatica', original: 'vou mercado', substituicao: 'vou ao mercado', motivo: 'falta preposição' },
      { tipo: 'palavra', original: 'eu', substituicao: 'nós todos juntos e mais um grupo grande de pessoas felizes hoje', motivo: 'mais de 10 palavras a mais, deve sumir' },
    ],
    'isso é açim mesmo': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'texto bom demais': [{ tipo: 'clareza', original: 'demais', substituicao: '', motivo: 'redundante' }],
    'sombra com açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'eu vou mercado e açim': [
      { tipo: 'gramatica', original: 'vou mercado', substituicao: 'vou ao mercado', motivo: 'falta preposição' },
      { tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' },
    ],
    'tá bom, vc vem?': [
      { tipo: 'tom', original: 'tá', substituicao: 'está', motivo: 'informal' },
      { tipo: 'tom', original: 'vc', substituicao: 'você', motivo: 'abreviação' },
    ],
    'outra sombra açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
  };
  globalThis.requestAnimationFrame = (fn) => setTimeout(fn, 16);
  const enviados = [];
  const pedidos = [];
  let ouvinte = null;
  globalThis.chrome = {
    runtime: {
      async sendMessage(msg) {
        if (msg.tipo === 'estadoAba') return { pausado: false };
        if (msg.tipo === 'revisar') {
          enviados.push(msg.texto);
          if (msg.pedido) pedidos.push(msg.texto);
          return { sugestoes: RevisorCore.filtrarSugestoes(msg.texto, RESPOSTAS[msg.texto] || []) };
        }
        return {};
      },
      getURL: (p) => `../${p}`,
      onMessage: { addListener(fn) { ouvinte = fn; } },
    },
    storage: { local: { get: async () => ({}), set: async () => {} }, onChanged: { addListener() {} } },
  };
</script>
<script src="../src/content.js"></script>
<script>
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  const sombra = () => document.querySelector('revisor-gemini-camada')?.shadowRoot;
  const linhas = [];
  let ok = 0, total = 0;
  const confere = (nome, valor, esperado) => {
    total++;
    if (JSON.stringify(valor) === JSON.stringify(esperado)) { ok++; linhas.push(`ok   ${nome}`); }
    else linhas.push(`FALHA ${nome}: esperado ${JSON.stringify(esperado)}, veio ${JSON.stringify(valor)}`);
  };
  const digitar = (el, texto) => {
    el.focus();
    if ('value' in el) el.value = texto; else el.textContent = texto;
    el.dispatchEvent(new InputEvent('input', { bubbles: true, composed: true }));
  };
  const passarMouse = (rect) => {
    document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2 }));
  };

  (async () => {
    try {
      await espera(100);
      const area = document.getElementById('area');
      const editavel = document.getElementById('editavel');

      digitar(area, 'eu vou mercado');
      digitar(editavel, 'isso é açim mesmo');
      digitar(document.getElementById('senha'), 'texto bom demais');
      digitar(document.getElementById('cartao'), 'texto bom demais');
      await espera(500);
      confere('nada é enviado antes da pausa na digitação', enviados.length, 0);
      await espera(1500);

      confere('envia só os campos comuns, nunca senha e cartão', enviados.slice().sort(), ['eu vou mercado', 'isso é açim mesmo']);
      const spans = [...sombra().querySelectorAll('.marca')];
      confere('textarea: um sublinhado de gramática; a troca com mais de 10 palavras a mais sumiu', spans.map((s) => [s.className, s.textContent]), [['marca marca-gramatica', 'vou mercado']]);
      confere('contenteditable: um highlight de gramática', CSS.highlights.get('revisor-gramatica')?.size, 1);

      passarMouse(spans[0].getBoundingClientRect());
      await espera(100);
      const cartao = sombra().querySelector('.cartao');
      confere('passar o mouse abre o cartão com a troca', [cartao?.querySelector('.de')?.textContent, cartao?.querySelector('.para')?.textContent], ['vou mercado', 'vou ao mercado']);
      confere('o cartão diz de qual camada veio a sugestão', cartao?.querySelector('.origem')?.textContent, 'via OpenRouter');
      confere('com uma correção só, não há Aplicar todas', cartao?.querySelector('.aplicar-todas'), null);
      cartao.querySelector('.aplicar').click();
      confere('aplicar troca o texto no textarea', area.value, 'eu vou ao mercado');
      await espera(1500);
      confere('após aplicar, o parágrafo novo não volta a ser enviado', enviados.filter((t) => t === 'eu vou ao mercado').length, 0);
      confere('após aplicar, o sublinhado some', sombra().querySelectorAll('.marca').length, 0);

      const range = [...CSS.highlights.get('revisor-gramatica')][0];
      passarMouse(range.getBoundingClientRect());
      await espera(100);
      sombra().querySelector('.cartao .aplicar').click();
      confere('aplicar troca o texto no contenteditable', editavel.textContent, 'isso é assim mesmo');

      digitar(area, 'texto bom demais');
      await espera(1500);
      const marca = sombra().querySelector('.marca');
      confere('remoção aparece como sublinhado de clareza', marca?.className, 'marca marca-clareza');
      passarMouse(marca.getBoundingClientRect());
      await espera(100);
      [...sombra().querySelectorAll('.cartao button')].find((b) => b.textContent === 'Ignorar').click();
      confere('ignorar some com o sublinhado', sombra().querySelectorAll('.marca').length, 0);
      digitar(area, 'texto bom demais');
      await espera(100);
      confere('ignorar vale para o texto do campo e não volta ao redesenhar', sombra().querySelectorAll('.marca').length, 0);

      confere('sem pedido, nenhum parágrafo vai marcado como pedido', pedidos.length, 0);
      ouvinte({ tipo: 'revisarPedido' });
      await espera(300);
      confere('pedido reenvia, marcados como pedido, os parágrafos já revisados dos campos', pedidos.slice().sort(), ['isso é assim mesmo', 'texto bom demais']);

      digitar(area, 'eu vou mercado e açim');
      await espera(1500);
      passarMouse(sombra().querySelector('.marca').getBoundingClientRect());
      await espera(100);
      const todas = sombra().querySelector('.cartao .aplicar-todas');
      confere('com duas correções, o cartão oferece Aplicar todas (2)', todas?.textContent, 'Aplicar todas (2)');
      todas.click();
      confere('Aplicar todas troca tudo no textarea', area.value, 'eu vou ao mercado e assim');
      await espera(1500);
      confere('após Aplicar todas, o texto corrigido não volta a ser enviado', enviados.filter((t) => t === 'eu vou ao mercado e assim').length, 0);
      confere('após Aplicar todas, nenhum sublinhado sobra', sombra().querySelectorAll('.marca').length, 0);

      digitar(editavel, 'tá bom, vc vem?');
      await espera(1500);
      passarMouse([...CSS.highlights.get('revisor-tom')][0].getBoundingClientRect());
      await espera(100);
      sombra().querySelector('.cartao .aplicar-todas').click();
      confere('Aplicar todas troca tudo no contenteditable', editavel.textContent, 'está bom, você vem?');

      const raizSombra = document.getElementById('hospedeiro').attachShadow({ mode: 'open' });
      raizSombra.innerHTML = '<style>textarea, [contenteditable] { display: block; width: 400px; font: 16px/1.4 sans-serif; margin: 20px; padding: 8px; }</style><textarea id="areaSombra"></textarea><div id="editavelSombra" contenteditable="true"></div>';
      const areaSombra = raizSombra.getElementById('areaSombra');
      const editavelSombra = raizSombra.getElementById('editavelSombra');
      digitar(areaSombra, 'sombra com açim');
      digitar(editavelSombra, 'outra sombra açim');
      await espera(1500);
      confere('campos dentro de shadow DOM são enviados para revisão', ['sombra com açim', 'outra sombra açim'].every((t) => enviados.includes(t)), true);
      const marcaSombra = sombra().querySelector('.marca');
      confere('textarea em shadow DOM ganha sublinhado', marcaSombra?.textContent, 'açim');
      passarMouse(marcaSombra.getBoundingClientRect());
      await espera(100);
      sombra().querySelector('.cartao .aplicar').click();
      confere('aplicar troca o texto do textarea em shadow DOM', areaSombra.value, 'sombra com assim');
      confere('contenteditable em shadow DOM ganha highlight', CSS.highlights.get('revisor-gramatica')?.size, 1);
      passarMouse([...CSS.highlights.get('revisor-gramatica')][0].getBoundingClientRect());
      await espera(100);
      sombra().querySelector('.cartao .aplicar').click();
      confere('aplicar troca o texto do contenteditable em shadow DOM', editavelSombra.textContent, 'outra sombra assim');
    } catch (e) {
      linhas.push(`FALHA execução: ${e.message}`);
      total++;
    }
    linhas.push(ok === total ? `PASSED ${ok}/${total}` : `FAILED ${ok}/${total}`);
    document.getElementById('resultado').textContent = linhas.join('\n');
  })();
</script>

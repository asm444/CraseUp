<script>
  const LONGO = `Primeira frase tem açim no começo. ${'Esta frase não tem problema nenhum para revisar. '.repeat(5)}A última frase tem nóis no fim.`;
  const MELHORIAS = { 'eu vou mercado amanha': 'Eu vou ao mercado amanhã.', 'eu vou mercado amanha\u200B': 'Eu vou ao mercado amanhã.', 'ola joao': 'Olá, João', 'texto fixo da pagina': 'Texto fixo da página.' };
  const RESPOSTAS = {
    'eu vou mercado': [
      { tipo: 'gramatica', original: 'vou mercado', substituicao: 'vou ao mercado', motivo: 'falta preposição' },
      { tipo: 'palavra', original: 'eu', substituicao: 'nós todos juntos e mais um grupo grande de pessoas felizes hoje', motivo: 'mais de 10 palavras a mais, deve sumir' },
    ],
    'isso é açim mesmo': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'texto com tag açim': [{ tipo: 'gramatica', original: 'açim', substituicao: '<img src=x onerror="window.invadiu=1">', motivo: '<b>negrito</b>' }],
    'manda pra ana@x.com açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'texto bom demais': [{ tipo: 'clareza', original: 'demais', substituicao: '', motivo: 'redundante' }],
    'sombra com açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'eu vou mercado e açim': [
      { tipo: 'gramatica', original: 'vou mercado', substituicao: 'vou ao mercado', motivo: 'falta preposição' },
      { tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' },
    ],
    'tá bom, vc vem?': [
      { tipo: 'tom', original: 'tá', substituicao: 'está', motivo: 'informal' },
      { tipo: 'tom', original: 'vc', substituicao: 'você', motivo: 'abreviação' },
    ],
    'editor sem input açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'chega aos poucos açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'rápida lenta açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'sem piscar açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'duas etapas açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    [LONGO]: [
      { tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' },
      { tipo: 'gramatica', original: 'nóis', substituicao: 'nós', motivo: 'grafia' },
    ],
    'rico bom demais': [{ tipo: 'clareza', original: ' demais', substituicao: '', motivo: 'redundante' }],
    'rico com açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'outra sombra açim': [{ tipo: 'gramatica', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
    'dicionário com açim': [{ tipo: 'gramatica', origem: 'languagetool', original: 'açim', substituicao: 'assim', motivo: 'grafia' }],
  };
  globalThis.requestAnimationFrame = (fn) => setTimeout(fn, 16);
  let raizDaCamada = null;
  let hostDaCamada = null;
  const attachShadowOriginal = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function (opcoes) {
    const raiz = attachShadowOriginal.call(this, opcoes);
    if (opcoes?.mode === 'closed') {
      raizDaCamada = raiz;
      hostDaCamada = this;
    }
    return raiz;
  };
  const enviados = [];
  const pedidos = [];
  const etapas = [];
  const reescritas = [];
  let ouvinte = null;
  const ouvintesDoStorage = [];
  const gravados = [];
  globalThis.chrome = {
    runtime: {
      async sendMessage(msg) {
        if (msg.tipo === 'estadoAba') return { pausado: false };
        if (msg.tipo === 'reescrever') {
          reescritas.push([msg.texto, msg.tom]);
          if (msg.tom === '') return { texto: MELHORIAS[msg.texto] ?? msg.texto, modelo: 'm' };
          await new Promise((pronto) => setTimeout(pronto, 60));
          return { texto: 'Eu irei ao mercado.', modelo: 'm' };
        }
        return {};
      },
      connect() {
        let ouvinteDaPorta = null;
        return {
          onMessage: { addListener(fn) { ouvinteDaPorta = fn; } },
          onDisconnect: { addListener() {} },
          disconnect() {},
          postMessage(msg) {
            enviados.push(msg.texto);
            etapas.push([msg.texto, msg.modelo]);
            if (msg.pedido) pedidos.push(msg.texto);
            const sugestoes = RevisorCore.filtrarSugestoes(msg.texto, RESPOSTAS[msg.texto] || []);
            if (msg.texto === 'chega aos poucos açim') {
              ouvinteDaPorta({ parcial: { sugestoes } });
              setTimeout(() => ouvinteDaPorta({ final: { sugestoes } }), 3000);
              return;
            }
            if (msg.texto === 'sem piscar açim' && msg.modelo) {
              ouvinteDaPorta({ parcial: { sugestoes: [] } });
              setTimeout(() => ouvinteDaPorta({ final: { sugestoes } }), 1000);
              return;
            }
            const provisorio = (['duas etapas açim', 'rápida lenta açim', 'sem piscar açim'].includes(msg.texto) && !msg.modelo) || msg.texto === 'o modelo sempre falha açim';
            setTimeout(() => ouvinteDaPorta({ final: { sugestoes, provisorio } }), msg.texto === 'rápida lenta açim' && !msg.modelo ? 1500 : 0);
          },
        };
      },
      getURL: (p) => `../${p}`,
      onMessage: { addListener(fn) { ouvinte = fn; } },
    },
    storage: { local: { get: async () => ({}), set: async (itens) => { gravados.push(itens); } }, onChanged: { addListener(fn) { ouvintesDoStorage.push(fn); } } },
  };
</script>
<script src="../src/protecao.js"></script>
<script src="../src/camada-estilo.js"></script>
<script src="../src/content.js"></script>
<script>
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  const clicar = async (alvo) => {
    alvo.scrollIntoView({ block: 'center' });
    const r = alvo.getBoundingClientRect();
    await cliqueReal(r.left + r.width / 2, r.top + r.height / 2);
    await espera(30);
  };
  const escolherTom = async (seletor, valor) => {
    seletor.focus();
    for (let i = 0; i < 15 && seletor.value !== valor; i++) await apertarReal(seletor.selectedIndex < [...seletor.options].findIndex((o) => o.value === valor) ? 'ArrowDown' : 'ArrowUp');
    await espera(30);
  };
  const rico = document.getElementById('editorRico');
  let modeloRico = '';
  let desfeitasNoRico = 0;
  rico.addEventListener('beforeinput', (e) => {
    const [alvo] = e.getTargetRanges();
    if (!['insertText', 'deleteContentBackward'].includes(e.inputType) || !alvo) return;
    e.preventDefault();
    modeloRico = modeloRico.slice(0, alvo.startOffset) + (e.data ?? '') + modeloRico.slice(alvo.endOffset);
    rico.textContent = modeloRico;
    rico.dispatchEvent(new InputEvent('input', { bubbles: true, composed: true }));
  });
  rico.addEventListener('input', () => {
    if (rico.textContent === modeloRico) return;
    desfeitasNoRico++;
    rico.textContent = modeloRico;
  });
  const sombra = () => raizDaCamada;
  const linhas = [];
  let ok = 0, total = 0;
  const confere = (nome, valor, esperado) => {
    total++;
    if (JSON.stringify(valor) === JSON.stringify(esperado)) { ok++; linhas.push(`ok   ${nome}`); }
    else linhas.push(`FALHA ${nome}: esperado ${JSON.stringify(esperado)}, veio ${JSON.stringify(valor)}`);
  };
  const digitar = async (el, texto) => {
    el.focus();
    if ('value' in el) {
      el.value = texto.slice(0, -1);
      el.setSelectionRange(el.value.length, el.value.length);
    } else {
      el.textContent = texto.slice(0, -1);
      const sel = el.getRootNode().getSelection ? el.getRootNode().getSelection() : getSelection();
      sel.selectAllChildren(el);
      sel.collapseToEnd();
    }
    await teclarReal(texto.slice(-1));
    if ('value' in el) {
      el.setSelectionRange(0, 0);
      el.scrollTop = 0;
    }
  };
  const tracos = (tipo, dentroDe) => [...sombra().querySelectorAll(`.traco-${tipo}`)].filter((t) => {
    if (!dentroDe) return true;
    const r = t.getBoundingClientRect();
    const c = dentroDe.getBoundingClientRect();
    const x = r.left + r.width / 2;
    const y = r.top + r.height / 2;
    return x >= c.left && x <= c.right && y >= c.top && y <= c.bottom;
  });
  const passarMouse = (rect) => {
    document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2 }));
  };

  (async () => {
    try {
      await espera(100);
      const area = document.getElementById('area');
      const editavel = document.getElementById('editavel');

      await digitar(area, 'eu vou mercado');
      await digitar(editavel, 'isso é açim mesmo');
      await digitar(document.getElementById('senha'), 'texto bom demais');
      await digitar(document.getElementById('cartao'), 'texto bom demais');
      await espera(150);
      confere('nada é enviado antes da pausa na digitação', enviados.length, 0);
      await espera(1500);

      confere('envia só os campos comuns, nunca senha e cartão', enviados.slice().sort(), ['eu vou mercado', 'isso é açim mesmo']);
      const spans = [...sombra().querySelectorAll('.marca')];
      confere('textarea: um sublinhado de gramática; a troca com mais de 10 palavras a mais sumiu', spans.map((s) => [s.className, s.textContent]), [['marca marca-gramatica', 'vou mercado']]);
      confere('contenteditable: um traço de gramática dentro da camada fechada e nada no registro de realces da página', [tracos('gramatica').length, [...CSS.highlights.keys()]], [1, []]);

      passarMouse(spans[0].getBoundingClientRect());
      await espera(100);
      const cartao = sombra().querySelector('.cartao');
      confere('passar o mouse abre o cartão com a troca', [cartao?.querySelector('.de')?.textContent, cartao?.querySelector('.para')?.textContent], ['vou mercado', 'vou ao mercado']);
      confere('o cartão diz de qual camada veio a sugestão', cartao?.querySelector('.origem')?.textContent, 'Via OpenRouter');
      confere('motivo e rótulos do cartão começam com maiúscula', [cartao?.querySelector('.motivo')?.textContent, cartao?.querySelector('.escolha-tom option')?.textContent], ['Falta preposição', 'Ajustar…']);
      confere('com um trecho só, o cartão não pagina', cartao?.querySelector('.pagina'), null);
      confere('a página não alcança a camada do cartão pelo shadowRoot', hostDaCamada.shadowRoot, null);
      cartao.querySelector('.aplicar').dispatchEvent(new MouseEvent('mousedown', { bubbles: true, composed: true }));
      confere('apertar o mouse dentro do cartão não o fecha', sombra().querySelector('.cartao') === cartao, true);
      const escolhaSintetica = cartao.querySelector('.escolha-tom');
      escolhaSintetica.value = 'formal';
      escolhaSintetica.dispatchEvent(new Event('change'));
      await espera(120);
      escolhaSintetica.value = '';
      cartao.querySelector('.aplicar').click();
      await espera(30);
      confere('clique e troca de tom sintéticos da página não acionam o cartão', [area.value, reescritas.length], ['eu vou mercado', 0]);
      confere('o botão principal é Substituir', cartao?.querySelector('.aplicar')?.textContent, 'Substituir');
      await clicar(cartao.querySelector('.aplicar'));
      confere('aplicar troca o texto no textarea', area.value, 'eu vou ao mercado');
      await espera(1500);
      confere('após aplicar, o parágrafo novo não volta a ser enviado', enviados.filter((t) => t === 'eu vou ao mercado').length, 0);
      confere('após aplicar, o sublinhado some', sombra().querySelectorAll('.marca').length, 0);

      passarMouse(tracos('gramatica')[0].getBoundingClientRect());
      await espera(100);
      const semProtegidos = sombra().querySelector('.cartao .protegidos');
      await clicar(sombra().querySelector('.cartao .aplicar'));
      confere('aplicar troca o texto no contenteditable', editavel.textContent, 'isso é assim mesmo');

      await digitar(area, 'manda pra ana@x.com açim');
      await espera(1500);
      passarMouse(sombra().querySelector('.marca-gramatica').getBoundingClientRect());
      await espera(100);
      confere('o cartão diz quantos dados protegidos não saíram do navegador, e só quando há algum', [sombra().querySelector('.cartao .protegidos')?.textContent, semProtegidos], ['1 dado protegido não saiu do navegador', null]);
      await apertarReal('Escape');

      await digitar(area, 'texto com tag açim');
      await espera(1500);
      passarMouse(sombra().querySelector('.marca-gramatica').getBoundingClientRect());
      await espera(300);
      const cartaoComTag = sombra().querySelector('.cartao');
      confere('HTML vindo na sugestão aparece como texto no cartão e não vira nó nem roda', [
        cartaoComTag?.querySelectorAll('img, b').length, cartaoComTag?.querySelector('.para')?.textContent, cartaoComTag?.querySelector('.motivo')?.textContent, window.invadiu,
      ], [0, '<img src=x onerror="window.invadiu=1">', '<b>negrito</b>', undefined]);
      await apertarReal('Escape');

      await digitar(area, 'texto bom demais');
      await espera(1500);
      const marca = sombra().querySelector('.marca');
      confere('remoção aparece como sublinhado de clareza', marca?.className, 'marca marca-clareza');
      passarMouse(marca.getBoundingClientRect());
      await espera(100);
      await clicar([...sombra().querySelectorAll('.cartao button')].find((b) => b.textContent === 'Ignorar'));
      confere('ignorar some com o sublinhado', sombra().querySelectorAll('.marca').length, 0);
      await digitar(area, 'texto bom demais');
      await espera(100);
      confere('ignorar vale para o texto do campo e não volta ao redesenhar', sombra().querySelectorAll('.marca').length, 0);

      confere('sem pedido, nenhum parágrafo vai marcado como pedido', pedidos.length, 0);
      ouvinte({ tipo: 'revisarPedido' });
      await espera(300);
      confere('pedido reenvia, marcados como pedido, os parágrafos já revisados dos campos', pedidos.slice().sort(), ['isso é assim mesmo', 'texto bom demais']);

      await digitar(area, 'eu vou mercado e açim');
      await espera(1500);
      passarMouse(sombra().querySelector('.marca').getBoundingClientRect());
      await espera(100);
      confere('parágrafo curto com duas correções abre um cartão só, com as duas na prévia', [...sombra().querySelectorAll('.cartao .para')].map((p) => p.textContent), ['vou ao mercado', 'assim']);
      confere('a prévia mostra o parágrafo inteiro já corrigido', sombra().querySelector('.cartao .previa').textContent, 'eu vou mercadovou ao mercado e açimassim');
      await clicar(sombra().querySelector('.cartao .aplicar'));
      confere('Substituir troca tudo do trecho no textarea', area.value, 'eu vou ao mercado e assim');
      await espera(1500);
      confere('após Substituir, o texto corrigido não volta a ser enviado', enviados.filter((t) => t === 'eu vou ao mercado e assim').length, 0);
      confere('após Substituir, nenhum sublinhado sobra', sombra().querySelectorAll('.marca').length, 0);

      await digitar(area, LONGO);
      await espera(1500);
      passarMouse(sombra().querySelector('.marca').getBoundingClientRect());
      await espera(100);
      confere('parágrafo longo pagina por frase', [sombra().querySelector('.cartao .pagina')?.textContent, sombra().querySelector('.cartao .previa')?.textContent], ['1 de 2', 'Primeira frase tem açimassim no começo.']);
      await clicar(sombra().querySelector('.cartao .aplicar'));
      await espera(50);
      confere('depois de substituir, o cartão continua aberto no trecho seguinte', [sombra().querySelector('.cartao .pagina'), sombra().querySelector('.cartao .previa')?.textContent], [null, 'A última frase tem nóisnós no fim.']);
      await clicar(sombra().querySelector('.cartao .aplicar'));
      confere('os dois trechos substituídos, um depois do outro', area.value, LONGO.replace('açim', 'assim').replace('nóis', 'nós'));
      await espera(50);
      confere('sem trecho restante, o cartão fecha', sombra().querySelector('.cartao'), null);

      await digitar(editavel, 'tá bom, vc vem?');
      await espera(1500);
      passarMouse(tracos('tom')[0].getBoundingClientRect());
      await espera(100);
      await clicar(sombra().querySelector('.cartao .aplicar'));
      confere('Substituir troca tudo do trecho no contenteditable', editavel.textContent, 'está bom, você vem?');

      await digitar(editavel, 'tá bom, vc vem?');
      await espera(1500);
      passarMouse(tracos('tom')[0].getBoundingClientRect());
      await espera(100);
      editavel.addEventListener('beforeinput', () => setTimeout(() => editavel.prepend('ZZZZ ')), { once: true });
      await clicar(sombra().querySelector('.cartao .aplicar'));
      await espera(50);
      confere('a página mexe no editor no meio do Substituir e o resto da troca para em vez de corromper', editavel.textContent, 'ZZZZ tá bom, você vem?');

      await digitar(area, 'o modelo sempre falha açim\noutro parágrafo');
      area.setSelectionRange(area.value.length, area.value.length);
      await espera(1300);
      for (const tecla of ['a', 'b']) {
        await teclarReal(tecla);
        await espera(1300);
      }
      confere('parágrafo que o modelo não conseguiu revisar não volta a cada pausa', etapas.filter(([t, modelo]) => t === 'o modelo sempre falha açim' && modelo).length, 1);

      await digitar(area, 'eu vou mercado');
      await espera(1500);
      passarMouse(sombra().querySelector('.marca').getBoundingClientRect());
      await espera(100);
      const fundoDoCartao = () => getComputedStyle(sombra().querySelector('.cartao')).backgroundColor;
      ouvintesDoStorage.forEach((fn) => fn({ tema: { newValue: 'claro' } }, 'local'));
      const fundoClaro = fundoDoCartao();
      ouvintesDoStorage.forEach((fn) => fn({ tema: { newValue: 'escuro' } }, 'local'));
      confere('o tema escolhido nas configurações muda o cartão para claro ou escuro', [fundoClaro, fundoDoCartao()], ['rgb(247, 244, 238)', 'rgb(18, 20, 27)']);
      confere('o tema não fica em atributo do elemento que a página vê', hostDaCamada.getAttributeNames(), ['style']);
      const seletor = sombra().querySelector('.cartao .escolha-tom');
      const cartaoAntesDoTom = sombra().querySelector('.cartao');
      const topoAntesDoTom = cartaoAntesDoTom.style.top;
      confere('o seletor de tom do cartão oferece dez tons, com LinkedIn e Advogado', [...seletor.options].slice(1).map((o) => o.value), ['formal', 'profissional', 'neutro', 'amigavel', 'casual', 'confiante', 'empatico', 'persuasivo', 'linkedin', 'advogado']);
      seletor.focus();
      await apertarReal('ArrowDown');
      const avisoEnquantoReescreve = sombra().querySelector('.cartao .motivo-tom')?.textContent;
      await espera(120);
      confere('o aviso e o motivo da reescrita trazem o rótulo do tom com maiúscula', [avisoEnquantoReescreve, sombra().querySelector('.cartao .motivo-tom')?.textContent], ['Reescrevendo no tom Formal…', 'Reescrito no tom Formal']);
      confere('escolher o tom pede a reescrita do trecho e a prévia mostra o resultado', [reescritas, sombra().querySelector('.cartao .previa')?.textContent], [[['eu vou mercado', 'formal']], 'Eu irei ao mercado.']);
      confere('trocar o tom muda o conteúdo do mesmo cartão, sem recriá-lo nem movê-lo', [sombra().querySelector('.cartao') === cartaoAntesDoTom, sombra().querySelector('.cartao').style.top === topoAntesDoTom], [true, true]);
      await clicar(sombra().querySelector('.cartao .aplicar'));
      confere('Substituir troca o trecho pela reescrita no tom', area.value, 'Eu irei ao mercado.');

      const menu = async (el, ponto = el) => {
        ponto.scrollIntoView({ block: 'center' });
        const raiz = el.getRootNode();
        const sel = raiz.getSelection ? raiz.getSelection() : getSelection();
        const range = sel?.rangeCount && !sel.isCollapsed ? sel.getRangeAt(0) : null;
        const r = range && el.contains(range.commonAncestorContainer) ? range.getBoundingClientRect() : ponto.getBoundingClientRect();
        await cliqueDireitoReal(r.left + r.width / 2, r.top + r.height / 2);
      };
      await digitar(area, 'eu vou mercado amanha');
      await espera(1500);
      area.setSelectionRange(3, 3);
      await menu(area);
      ouvinte({ tipo: 'verificarAqui' });
      await espera(50);
      const verificacao = () => sombra().querySelector('.cartao-verificacao');
      const textoNovo = (previa) => {
        const copia = previa.cloneNode(true);
        copia.querySelectorAll('.de').forEach((e) => e.remove());
        return copia.textContent;
      };
      confere('botão direito sem seleção verifica o campo inteiro, sem tom', reescritas.at(-1), ['eu vou mercado amanha', '']);
      {
        const campo = area.getBoundingClientRect();
        const caixa = verificacao().getBoundingClientRect();
        confere('o cartão da verificação abre colado ao campo, não no ponto do clique', [caixa.top > campo.bottom && caixa.top - campo.bottom < 16, Math.round(caixa.left - campo.left)], [true, 0]);
      }
      confere('a prévia da verificação mostra só as palavras que mudam', [...verificacao().querySelectorAll('.de')].map((e) => e.textContent).concat([...verificacao().querySelectorAll('.para')].map((e) => e.textContent)), ['eu', 'amanha', 'Eu', 'ao ', 'amanhã.']);
      confere('na verificação, a origem e a opção de manter o tom começam com maiúscula', [verificacao().querySelector('.origem')?.textContent, verificacao().querySelector('.escolha-tom option')?.textContent], ['Via OpenRouter (m)', 'Manter']);
      const tomDaVerificacao = verificacao().querySelector('.escolha-tom');
      const verificacaoAntesDoTom = verificacao();
      const topoDaVerificacao = verificacao().style.top;
      await escolherTom(tomDaVerificacao, 'formal');

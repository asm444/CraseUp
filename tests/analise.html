<!doctype html>
<meta charset="utf-8">
<pre id="resultado">NAO EXECUTADO</pre>
<script src="../src/analise.js"></script>
<script>
  const A = RevisorAnalise;
  const linhas = [];
  let ok = 0, total = 0;
  const confere = (nome, valor, esperado) => {
    total++;
    if (JSON.stringify(valor) === JSON.stringify(esperado)) { ok++; linhas.push(`ok   ${nome}`); }
    else linhas.push(`FALHA ${nome}: esperado ${JSON.stringify(esperado)}, veio ${JSON.stringify(valor)}`);
  };
  const frases = (t) => A.frases(t).map((f) => f.texto);
  const RISO = '\u{1F600}', JOIA = '\u{1F44D}';

  confere('abreviação não fecha a frase', frases('O Sr. Silva e a Dra. Ana chegaram. Depois saíram.'), ['O Sr. Silva e a Dra. Ana chegaram.', 'Depois saíram.']);
  confere('etc. e p.ex. no meio da frase não quebram', frases('Trouxe frutas, etc. e pães, p.ex. o francês. Fim.'), ['Trouxe frutas, etc. e pães, p.ex. o francês.', 'Fim.']);
  confere('número com ponto não quebra', frases('Custou R$ 1.250,00 e pesa 3.5 kg. Ok.'), ['Custou R$ 1.250,00 e pesa 3.5 kg.', 'Ok.']);
  confere('reticências fecham a frase só antes de maiúscula', frases('Bom... vamos ver. Pensei… Não sei.'), ['Bom... vamos ver.', 'Pensei…', 'Não sei.']);
  confere('emoji não vira palavra e não quebra a frase sozinho', [frases(`Ficou ótimo ${RISO} de verdade! Valeu ${JOIA}`), A.palavras(`Ficou ótimo ${RISO}`).map((p) => p.palavra)], [[`Ficou ótimo ${RISO} de verdade!`, `Valeu ${JOIA}`], ['Ficou', 'ótimo']]);
  confere('a posição de cada frase aponta para o texto original', A.frases('  Oi.  Tudo bem?').map((f) => [f.inicio, f.fim]), [[2, 5], [7, 16]]);
  confere('palavras com acento, hífen e apóstrofo', A.palavras("guarda-chuva d'água ação").map((p) => [p.palavra, p.inicio]), [['guarda-chuva', 0], ["d'água", 13], ['ação', 20]]);
  confere('stopwords em português e inglês', [A.ehStopword('Para'), A.ehStopword('casa'), A.ehStopword('the', 'en-US'), A.ehStopword('house', 'en-US')], [true, false, true, false]);
  confere('radical junta plural, gerúndio, particípio e advérbio', ['casas', 'falando', 'falado', 'rapidamente', 'canções', 'canção', 'mar'].map((p) => A.radical(p)), ['cas', 'fal', 'fal', 'rapid', 'canç', 'canç', 'mar']);
  confere('contagem de palavras por frase', A.contagemPorFrase('Eu vou ao mercado. Depois volto.').map((f) => f.palavras), [4, 2]);
  confere('distância entre ocorrências do mesmo radical, sem stopwords', Object.fromEntries(A.distancias('O projeto atrasou. Projetos atrasam quando o projeto muda.')), { projet: [2, 2], atras: [2] });

  const repetido = 'casa '.repeat(40000);
  const t0 = performance.now();
  const muitas = A.distancias(repetido).get('cas').length;
  const ms = performance.now() - t0;
  confere('a mesma palavra repetida 40 mil vezes é medida em menos de 1 s', [muitas, ms < 1000], [39999, true]);
  linhas.push(`     distancias com 40 mil repetições: ${ms.toFixed(0)} ms`);

  document.getElementById('resultado').textContent = `${ok === total ? 'PASSED' : 'FAILED'} ${ok}/${total}\n${linhas.join('\n')}`;
</script>
